# Synthea configuration for the care gap pipeline.
# Only deviations from Synthea defaults are listed.

# Patient exports are transaction bundles. Synthea emits the related hospital
# and practitioner directories as batch bundles; ingestion normalizes those to
# transactions and rewrites POST entries to idempotent PUTs before storage.
exporter.fhir.transaction_bundle = true
exporter.fhir.export = true

# Provider and clinician directories referenced by patient bundles.
exporter.hospital.fhir.export = true
exporter.practitioner.fhir.export = true

# Enough clinical history for the measure lookback windows (27 months for
# breast cancer screening, 10 years for colonoscopy).
exporter.years_of_history = 12

exporter.baseDirectory = ./output
