# Local development against the compose PostgreSQL; no GCP credentials needed.
# BigQuery is replaced by LocalMeasureRunner (no credible emulator exists).
spring:
  datasource:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5433/caregaps}
    username: ${DB_USERNAME:caregap}
    password: ${DB_PASSWORD:caregap}

gapanalysis:
  bigquery-dataset: ${BQ_DATASET:fhir_data}
  # Write-back demoable end-to-end locally against the compose HAPI store.
  fhir-writeback-enabled: ${FHIR_WRITEBACK_ENABLED:true}
  fhir-store-url: ${FHIR_STORE_URL:http://localhost:8090/fhir}
  use-google-auth: false
