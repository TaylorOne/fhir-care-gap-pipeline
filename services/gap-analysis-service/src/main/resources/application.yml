spring:
  application:
    name: gap-analysis-service
  datasource:
    # GCP: jdbc:postgresql:///caregaps?cloudSqlInstance=...&socketFactory=com.google.cloud.sql.postgres.SocketFactory&enableIamAuth=true
    url: ${DB_JDBC_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  flyway:
    placeholders:
      # database user of care-gap-api, granted read access by V3
      apiuser: ${API_DB_USER:caregap}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

gapanalysis:
  bigquery-project: ${BQ_PROJECT:}
  bigquery-dataset: ${BQ_DATASET:}
