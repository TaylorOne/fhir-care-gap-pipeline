spring:
  application:
    name: ingestion-service

server:
  port: ${PORT:8080} # Cloud Run injects PORT

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true # /actuator/health/{liveness,readiness} for Cloud Run probes

ingestion:
  # e.g. https://healthcare.googleapis.com/v1/projects/PROJECT/locations/LOC/datasets/DS/fhirStores/STORE/fhir
  fhir-store-url: ${FHIR_STORE_URL:}
  use-google-auth: ${FHIR_USE_GOOGLE_AUTH:true}
  expected-bucket: ${INGEST_BUCKET:}
  max-attempts: ${INGEST_MAX_ATTEMPTS:5}
  initial-backoff: ${INGEST_INITIAL_BACKOFF:500ms}
  max-backoff: ${INGEST_MAX_BACKOFF:8s}
