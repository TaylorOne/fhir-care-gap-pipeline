name: Deploy gap-analysis-service

on:
  push:
    branches: [main]
    paths:
      - "services/gap-analysis-service/**"
      - "measures/**" # measure SQL is packaged into this service's image
      - "pom.xml"

jobs:
  deploy:
    uses: ./.github/workflows/deploy-service.yml
    with:
      service: gap-analysis-service
    permissions:
      id-token: write
      contents: read
