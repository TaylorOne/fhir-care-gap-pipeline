name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers integration tests run here too — GitHub runners have Docker.
      - name: Build and test all services
        run: mvn -B verify

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Unit tests (headless)
        run: npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox
      - name: Production build
        run: npm run build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -recursive infra
      # Validation only: plan/apply stays a reviewed manual step (see docs).
      - name: Validate
        working-directory: infra/envs/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate
