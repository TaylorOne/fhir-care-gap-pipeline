name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/fhir-pipeline/care-gap-dashboard:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - name: Build and push image
        run: |
          docker build -t "$IMAGE" dashboard
          docker push "$IMAGE"
      - name: Roll the Cloud Run revision
        run: >
          gcloud run deploy care-gap-dashboard
          --project ${{ vars.GCP_PROJECT }}
          --region ${{ vars.GCP_REGION }}
          --image "$IMAGE"
